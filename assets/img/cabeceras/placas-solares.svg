    <path class="curva" pathLength="1" d="M606 124 C 640 124, 655 64, 684 64 S 728 124, 762 124" fill="none" stroke="#ffc35c" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- arbol -->
