  <!-- bateria -->
  <rect x="560" y="378" width="40" height="56" rx="6" fill="#1b1f24" stroke="#8b9099" stroke-width="2"/>
  <rect x="573" y="372" width="14" height="7" rx="2" fill="#8b9099"/>
  <rect class="nivel" x="566" y="384" width="28" height="44" rx="3" fill="#3ddc84" opacity=".85"/>

  <!-- grafica de produccion -->
  <g>
    <rect x="592" y="30" width="184" height="108" rx="10" fill="#121519" fill-opacity=".85" stroke="rgba(255,255,255,.14)"/>
    <text x="606" y="50" fill="rgba(255,255,255,.6)" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">PRODUCCIÓN HOY</text>
    <circle class="led" cx="760" cy="47" r="3.5" fill="#3ddc84"/>
    <path d="M606 124 H 762" stroke="rgba(255,255,255,.12)"/>
    <g clip-path="url(#ps-grafica)">
      <path class="area" d="M606 124 C 640 124, 655 64, 684 64 S 728 124, 762 124 Z" fill="url(#ps-area)"/>
