  <path d="M232 200 H 568 L 650 324 H 150 Z" fill="#9a0026"/>
  <path d="M150 324 H 650" stroke="#c8103f" stroke-width="6" stroke-linecap="round"/>
  <path d="M232 200 H 568" stroke="#74001d" stroke-width="4" stroke-linecap="round"/>

  <!-- placas -->
  <g fill="url(#ps-panel)" stroke="#c3c6cc" stroke-width="1.6" stroke-linejoin="round"><path d="M253.4 217.1 L296.2 217.1 L273.8 262.9 L221.6 262.9Z"/><path d="M303.5 217.1 L346.3 217.1 L334.7 262.9 L282.5 262.9Z"/><path d="M353.5 217.1 L396.4 217.1 L395.6 262.9 L343.5 262.9Z"/><path d="M403.6 217.1 L446.5 217.1 L456.5 262.9 L404.4 262.9Z"/><path d="M453.7 217.1 L496.5 217.1 L517.5 262.9 L465.3 262.9Z"/><path d="M503.8 217.1 L546.6 217.1 L578.4 262.9 L526.2 262.9Z"/><path d="M217.3 269.1 L270.7 269.1 L248.2 314.9 L185.5 314.9Z"/><path d="M279.7 269.1 L333.1 269.1 L321.5 314.9 L258.8 314.9Z"/><path d="M342.1 269.1 L395.5 269.1 L394.7 314.9 L332.0 314.9Z"/><path d="M404.5 269.1 L457.9 269.1 L468.0 314.9 L405.3 314.9Z"/><path d="M466.9 269.1 L520.3 269.1 L541.2 314.9 L478.5 314.9Z"/><path d="M529.3 269.1 L582.7 269.1 L614.5 314.9 L551.8 314.9Z"/></g>
  <path d="M267.7 217.1 L239.0 262.9 M282.0 217.1 L256.4 262.9 M237.5 240.0 L285.0 240.0 M317.7 217.1 L299.9 262.9 M332.0 217.1 L317.3 262.9 M293.0 240.0 L340.5 240.0 M367.8 217.1 L360.8 262.9 M382.1 217.1 L378.2 262.9 M348.5 240.0 L396.0 240.0 M417.9 217.1 L421.8 262.9 M432.2 217.1 L439.2 262.9 M404.0 240.0 L451.5 240.0 M468.0 217.1 L482.7 262.9 M482.3 217.1 L500.1 262.9 M459.5 240.0 L507.0 240.0 M518.0 217.1 L543.6 262.9 M532.3 217.1 L561.0 262.9 M515.0 240.0 L562.5 240.0 M235.1 269.1 L206.4 314.9 M252.9 269.1 L227.3 314.9 M201.4 292.0 L259.4 292.0 M297.5 269.1 L279.7 314.9 M315.3 269.1 L300.6 314.9 M269.2 292.0 L327.3 292.0 M359.9 269.1 L352.9 314.9 M377.7 269.1 L373.8 314.9 M337.1 292.0 L395.1 292.0 M422.3 269.1 L426.2 314.9 M440.1 269.1 L447.1 314.9 M404.9 292.0 L462.9 292.0 M484.7 269.1 L499.4 314.9 M502.5 269.1 L520.3 314.9 M472.7 292.0 L530.8 292.0 M547.1 269.1 L572.7 314.9 M564.9 269.1 L593.6 314.9 M540.6 292.0 L598.6 292.0" stroke="rgba(195,198,204,.35)" stroke-width="1"/>
  <g clip-path="url(#ps-placas)">
    <rect class="dia" x="150" y="200" width="500" height="130" fill="#ffc35c" fill-opacity=".2"/>
    <path class="brillo" d="M150 200 h60 l-70 130 h-60 Z" fill="url(#ps-luz)"/>
  </g>
  <g stroke="#5a6069" stroke-width="3"><path d="M196 318 v8 M604 318 v8"/></g>

  <!-- fachada -->
  <rect x="200" y="352" width="56" height="44" rx="3" fill="#121519"/><rect x="204" y="356" width="48" height="36" rx="2" fill="#ffd27a" opacity=".75"/>
  <rect x="290" y="352" width="56" height="44" rx="3" fill="#121519"/><rect x="294" y="356" width="48" height="36" rx="2" fill="#ffd27a" opacity=".6"/>
  <rect x="380" y="370" width="40" height="70" rx="3" fill="#33373d"/><circle cx="412" cy="406" r="2.5" fill="#8b9099"/>

  <!-- cableado: placas -> inversor -> bateria / casa -->
  <path d="M612 324 V 356 H 512" fill="none" stroke="#3a4049" stroke-width="5"/>
  <path class="cable" d="M612 324 V 356 H 512" fill="none" stroke="#ffd27a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M486 390 V 420 H 560" fill="none" stroke="#3a4049" stroke-width="5"/>
  <path class="cable" d="M486 390 V 420 H 560" fill="none" stroke="#3ddc84" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M460 372 H 350" fill="none" stroke="#3a4049" stroke-width="4"/>
  <path class="cable" d="M460 372 H 350" fill="none" stroke="#ff9fb6" stroke-width="2" stroke-linecap="round"/>

  <!-- inversor -->
  <rect x="460" y="338" width="52" height="56" rx="7" fill="#e4e5e8"/>
  <rect x="468" y="347" width="36" height="15" rx="3" fill="#121519"/>
