<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>
    .sol { transform-origin: 400px 600px; animation: sol 16s linear infinite; }
    @keyframes sol { 0% { transform: rotate(-58deg); opacity: 0; } 7% { opacity: 1; } 93% { opacity: 1; } 100% { transform: rotate(58deg); opacity: 0; } }
    .dia { animation: dia 16s linear infinite; opacity: 0; }
    @keyframes dia { 0%, 4% { opacity: 0; } 50% { opacity: 1; } 96%, 100% { opacity: 0; } }
    .brillo { animation: brillo 4s ease-in-out infinite; }
    @keyframes brillo { 0% { transform: translateX(-420px); } 60%, 100% { transform: translateX(520px); } }
    .curva { stroke-dasharray: 1; stroke-dashoffset: 1; animation: curva 16s linear infinite; }
    @keyframes curva { 0%, 4% { stroke-dashoffset: 1; } 96% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .area { animation: dia 16s linear infinite; }
    .cable { stroke-dasharray: 5 11; animation: fluir .9s linear infinite; }
    @keyframes fluir { to { stroke-dashoffset: -16; } }
    .led { animation: led 1.6s ease-in-out infinite; }
    @keyframes led { 50% { opacity: .35; } }
    .nivel { transform-origin: 0 404px; transform-box: view-box; animation: nivel 16s ease-in-out infinite; }
    @keyframes nivel { 0%, 10% { transform: scaleY(.2); } 85%, 100% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) {
      .sol, .dia, .brillo, .curva, .area, .cable, .led, .nivel { animation: none; }
      .sol { transform: none; } .dia, .area { opacity: 1; } .curva { stroke-dashoffset: 0; } .brillo { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="ps-cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14181d"/><stop offset="1" stop-color="#3a1220"/></linearGradient>
    <linearGradient id="ps-dia" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f3350"/><stop offset=".7" stop-color="#6b3a3f"/><stop offset="1" stop-color="#c0704a"/></linearGradient>
    <radialGradient id="ps-sol" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff1cf"/><stop offset=".35" stop-color="#ffc35c" stop-opacity=".75"/><stop offset="1" stop-color="#ffc35c" stop-opacity="0"/></radialGradient>
    <linearGradient id="ps-panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34507a"/><stop offset="1" stop-color="#14203a"/></linearGradient>
    <linearGradient id="ps-luz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="ps-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc35c" stop-opacity=".45"/><stop offset="1" stop-color="#ffc35c" stop-opacity="0"/></linearGradient>
    <clipPath id="ps-placas"><path d="M253.4 217.1 L296.2 217.1 L273.8 262.9 L221.6 262.9Z"/><path d="M303.5 217.1 L346.3 217.1 L334.7 262.9 L282.5 262.9Z"/><path d="M353.5 217.1 L396.4 217.1 L395.6 262.9 L343.5 262.9Z"/><path d="M403.6 217.1 L446.5 217.1 L456.5 262.9 L404.4 262.9Z"/><path d="M453.7 217.1 L496.5 217.1 L517.5 262.9 L465.3 262.9Z"/><path d="M503.8 217.1 L546.6 217.1 L578.4 262.9 L526.2 262.9Z"/><path d="M217.3 269.1 L270.7 269.1 L248.2 314.9 L185.5 314.9Z"/><path d="M279.7 269.1 L333.1 269.1 L321.5 314.9 L258.8 314.9Z"/><path d="M342.1 269.1 L395.5 269.1 L394.7 314.9 L332.0 314.9Z"/><path d="M404.5 269.1 L457.9 269.1 L468.0 314.9 L405.3 314.9Z"/><path d="M466.9 269.1 L520.3 269.1 L541.2 314.9 L478.5 314.9Z"/><path d="M529.3 269.1 L582.7 269.1 L614.5 314.9 L551.8 314.9Z"/></clipPath>
    <clipPath id="ps-grafica"><rect x="604" y="62" width="160" height="62"/></clipPath>
  </defs>
  <rect width="800" height="500" fill="url(#ps-cielo)"/>
  <rect class="dia" width="800" height="500" fill="url(#ps-dia)"/>
  <g fill="#fff" opacity=".35"><circle cx="60" cy="40" r="1.3"/><circle cx="210" cy="70" r="1"/><circle cx="520" cy="30" r="1.2"/><circle cx="330" cy="110" r="1"/><circle cx="740" cy="200" r="1"/></g>

