  <text x="58" y="108" fill="rgba(255,255,255,.6)" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">BATERÍA</text>
  <g fill="rgba(255,255,255,.08)"><rect x="58" y="116" width="14" height="26" rx="2"/><rect x="75" y="116" width="14" height="26" rx="2"/><rect x="92" y="116" width="14" height="26" rx="2"/><rect x="109" y="116" width="14" height="26" rx="2"/><rect x="126" y="116" width="14" height="26" rx="2"/><rect x="143" y="116" width="14" height="26" rx="2"/><rect x="160" y="116" width="14" height="26" rx="2"/><rect x="177" y="116" width="14" height="26" rx="2"/><rect x="194" y="116" width="14" height="26" rx="2"/><rect x="211" y="116" width="14" height="26" rx="2"/></g>
  <g clip-path="url(#pc-segs)"><rect class="relleno" x="58" y="116" width="168" height="26" fill="#3ddc84"/></g>
  <rect x="227" y="123" width="5" height="12" rx="1.5" fill="rgba(255,255,255,.2)"/>
  <text class="parpadeo" x="58" y="166" fill="#3ddc84" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">⚡ CARGANDO</text>

  <!-- wallbox -->
  <rect x="146" y="232" width="64" height="96" rx="12" fill="#e4e5e8"/>
  <rect x="146" y="232" width="64" height="96" rx="12" fill="none" stroke="#fff" stroke-opacity=".5"/>
  <rect x="158" y="246" width="40" height="40" rx="20" fill="#121519"/>
  <circle class="anillo" cx="178" cy="266" r="15" fill="none" stroke="#3ddc84" stroke-width="3" stroke-linecap="round"/>
  <path d="M180 256 l-6 11 h6 l-3 9 8 -13 h-6 z" fill="#3ddc84"/>
  <rect x="162" y="298" width="32" height="4" rx="2" fill="#c3c6cc"/>
  <rect class="pulso" x="170" y="308" width="16" height="4" rx="2" fill="#3ddc84"/>
  <rect x="168" y="328" width="20" height="10" rx="3" fill="#8b9099"/>

  <!-- cable -->
  <path d="M178 338 C 178 430, 236 452, 278 434 S 310 392, 316 370" fill="none" stroke="#121519" stroke-width="7" stroke-linecap="round"/>
  <path class="cable" d="M178 338 C 178 430, 236 452, 278 434 S 310 392, 316 370" fill="none" stroke="#3ddc84" stroke-width="2.5" stroke-linecap="round"/>

