<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>
    .tubo { animation: tubo 1.6s steps(1) 1 both; }
    .tubo.t2 { animation-delay: .25s; } .tubo.t3 { animation-delay: .5s; }
    @keyframes tubo { 0% { opacity: .1; } 15% { opacity: 1; } 25% { opacity: .2; } 40%, 100% { opacity: 1; } }
    .cable { stroke-dasharray: 4 12; animation: fluir .8s linear infinite; }
    @keyframes fluir { to { stroke-dashoffset: -16; } }
    .pulso { animation: pulso 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulso { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    .anillo { stroke-dasharray: 60 120; transform-box: fill-box; transform-origin: center; animation: gira 1.4s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    .relleno { transform-box: fill-box; transform-origin: left center; animation: llenar 12s ease-in-out infinite; }
    @keyframes llenar { 0% { transform: scaleX(.18); } 80%, 100% { transform: scaleX(1); } }
    .parpadeo { animation: parpadeo 1.2s steps(1) infinite; }
    @keyframes parpadeo { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) {
      .tubo, .cable, .pulso, .anillo, .relleno, .parpadeo { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="pc-muro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2128"/><stop offset="1" stop-color="#2a2f37"/></linearGradient>
    <linearGradient id="pc-suelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22262d"/><stop offset="1" stop-color="#121519"/></linearGradient>
    <linearGradient id="pc-luz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f0ff" stop-opacity=".22"/><stop offset="1" stop-color="#e8f0ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="pc-coche" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8103f"/><stop offset=".55" stop-color="#9a0026"/><stop offset="1" stop-color="#5e0018"/></linearGradient>
    <linearGradient id="pc-cristal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b4a63"/><stop offset="1" stop-color="#151b26"/></linearGradient>
    <radialGradient id="pc-brillo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3ddc84" stop-opacity=".9"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/></radialGradient>
    <radialGradient id="pc-sombra" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <clipPath id="pc-segs"><rect x="58" y="116" width="14" height="26" rx="2"/><rect x="75" y="116" width="14" height="26" rx="2"/><rect x="92" y="116" width="14" height="26" rx="2"/><rect x="109" y="116" width="14" height="26" rx="2"/><rect x="126" y="116" width="14" height="26" rx="2"/><rect x="143" y="116" width="14" height="26" rx="2"/><rect x="160" y="116" width="14" height="26" rx="2"/><rect x="177" y="116" width="14" height="26" rx="2"/><rect x="194" y="116" width="14" height="26" rx="2"/><rect x="211" y="116" width="14" height="26" rx="2"/></clipPath>
  </defs>

  <!-- garaje -->
  <rect width="800" height="500" fill="url(#pc-muro)"/>
  <g stroke="rgba(255,255,255,.035)" stroke-width="2"><path d="M0 140 H 800 M0 200 H 800 M0 260 H 800 M0 320 H 800 M0 380 H 800"/></g>
  <rect width="800" height="52" fill="#121519"/>
  <rect x="0" y="52" width="800" height="6" fill="#33373d"/>
  <rect x="720" y="58" width="56" height="388" fill="#262b32"/>
  <rect x="720" y="380" width="56" height="66" fill="#c8a43a"/><g stroke="#1b1f24" stroke-width="10"><path d="M720 392 l20 -12 M720 420 l56 -34 M732 446 l44 -26"/></g>
  <rect x="728" y="120" width="40" height="28" rx="4" fill="#9a0026"/><text x="748" y="139" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">P14</text>
  <rect y="446" width="800" height="54" fill="url(#pc-suelo)"/>
  <path d="M250 500 L 262 446 M712 500 L 700 446" stroke="#c8a43a" stroke-width="4" opacity=".7"/>

  <!-- tubos de luz -->
  <g class="tubo"><path d="M120 62 L 40 446 H 340 L 260 62 Z" fill="url(#pc-luz)"/><rect x="120" y="58" width="140" height="7" rx="3" fill="#eef3ff"/></g>
  <g class="tubo t2"><path d="M380 62 L 300 446 H 600 L 520 62 Z" fill="url(#pc-luz)"/><rect x="380" y="58" width="140" height="7" rx="3" fill="#eef3ff"/></g>
  <g class="tubo t3"><path d="M600 62 L 560 446 H 760 L 680 62 Z" fill="url(#pc-luz)"/><rect x="600" y="58" width="80" height="7" rx="3" fill="#eef3ff"/></g>

