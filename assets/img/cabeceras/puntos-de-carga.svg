  <ellipse cx="506" cy="448" rx="230" ry="12" fill="url(#pc-sombra)"/>
  <path d="M302 414 L 298 372 Q 300 350 328 344 L 404 336 Q 444 300 484 292 L 584 292 Q 616 294 644 330 L 694 340 Q 716 346 718 372 L 716 414 Z" fill="url(#pc-coche)"/>
  <path d="M310 360 H 708" stroke="#ff9fb6" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M424 336 Q 452 308 488 302 L 542 302 V 336 Z" fill="url(#pc-cristal)"/>
  <path d="M554 302 H 582 Q 604 304 626 334 L 554 336 Z" fill="url(#pc-cristal)"/>
  <path d="M500 304 L 470 334" stroke="#fff" stroke-opacity=".12" stroke-width="6"/>
  <rect x="540" y="344" width="16" height="4" rx="2" fill="#5e0018"/><rect x="460" y="344" width="16" height="4" rx="2" fill="#5e0018"/>
  <path d="M702 352 h12 v10 h-14 z" fill="#ffe3a3"/>
  <path d="M300 356 h8 v14 h-9 z" fill="#ff3b5c"/>
  <circle class="pulso" cx="320" cy="370" r="18" fill="url(#pc-brillo)"/>
  <rect x="312" y="362" width="14" height="14" rx="3" fill="#121519" stroke="#3ddc84" stroke-width="1.5"/>
