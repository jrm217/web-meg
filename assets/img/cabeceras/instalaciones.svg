<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>
    .luz { animation: luz 9s ease-in-out infinite; opacity: 0.08; }
    .p1 { animation-delay: 0.8s; } .p2 { animation-delay: 1.8s; } .p3 { animation-delay: 2.8s; }
    @keyframes luz { 0%, 6% { opacity: 0.08; } 9%, 84% { opacity: 1; } 92%, 100% { opacity: 0.08; } }
    .cono { animation: luz 9s ease-in-out infinite; opacity: 0; }
    .cable { stroke-dasharray: 6 12; animation: fluir 1s linear infinite; }
    @keyframes fluir { to { stroke-dashoffset: -18; } }
    .led { animation: led 9s steps(1) infinite; fill: #5a6069; }
    @keyframes led { 0%, 7% { fill: #5a6069; } 8%, 90% { fill: #3ddc84; } }
    .rayo { animation: rayo 2.4s ease-in-out infinite; transform-origin: 95px 392px; }
    @keyframes rayo { 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) {
      .luz, .cono, .led, .cable, .rayo { animation: none; }
      .luz, .cono { opacity: 1; } .led { fill: #3ddc84; }
    }
  </style>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14181d"/><stop offset="1" stop-color="#2d1019"/></linearGradient>
    <linearGradient id="cono" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></linearGradient>
    <linearGradient id="muro" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#262b32"/><stop offset="1" stop-color="#1e2228"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".6"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#cielo)"/>
  <g fill="#fff" opacity=".4"><circle cx="60" cy="50" r="1.4"/><circle cx="180" cy="90" r="1"/><circle cx="700" cy="60" r="1.4"/><circle cx="760" cy="150" r="1"/><circle cx="120" cy="190" r="1"/></g>
  <rect y="440" width="800" height="60" fill="#0f1215"/>

  <!-- centro de transformación -->
  <rect x="40" y="350" width="112" height="90" rx="4" fill="#c3c6cc"/>
  <path d="M32 352 H 160 L 152 338 H 40 Z" fill="#8b9099"/>
  <rect x="54" y="366" width="38" height="74" rx="2" fill="#9a0026"/>
  <rect x="100" y="366" width="38" height="74" rx="2" fill="#9a0026"/>
  <path class="rayo" d="M88 380 l14 -8 -5 11 9 0 -17 13 5 -11 -9 0z" fill="#ffd27a"/>
  <text x="96" y="332" fill="rgba(255,255,255,.55)" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">C. T.</text>
  <!-- acometida subterránea -->
  <path d="M152 430 V 462 H 256 V 410" fill="none" stroke="#3a4049" stroke-width="5"/>
  <path class="cable" d="M152 430 V 462 H 256 V 410" fill="none" stroke="#ff9fb6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- edificio en corte -->
  <path d="M206 128 L 430 52 L 654 128 Z" fill="#9a0026"/>
  <path d="M206 128 L 430 52 L 654 128" fill="none" stroke="#c8103f" stroke-width="5" stroke-linejoin="round"/>
  <rect x="220" y="126" width="420" height="314" fill="url(#muro)" stroke="#33373d" stroke-width="2"/>
  <rect x="220" y="230" width="420" height="6" fill="#33373d"/>
  <rect x="220" y="334" width="420" height="6" fill="#33373d"/>

  <!-- montante y derivaciones -->
  <path d="M256 352 V 142 M256 142 H 600 M256 246 H 600 M256 350 H 600" fill="none" stroke="#3a4049" stroke-width="4"/>
  <path class="cable" d="M256 352 V 142 M256 142 H 600 M256 246 H 600 M256 350 H 600" fill="none" stroke="#c8103f" stroke-width="2" stroke-linecap="round"/>

  <!-- cuadro -->
  <rect x="234" y="352" width="44" height="62" rx="4" fill="#e4e5e8"/>
  <g fill="#1b1f24"><rect x="240" y="362" width="7" height="16" rx="1.5"/><rect x="250" y="362" width="7" height="16" rx="1.5"/><rect x="260" y="362" width="7" height="16" rx="1.5"/><rect x="270" y="362" width="5" height="16" rx="1.5"/></g>
  <circle cx="244" cy="400" r="3" class="led p1"/><circle cx="256" cy="400" r="3" class="led p2"/><circle cx="268" cy="400" r="3" class="led p3"/>

  <!-- planta baja: nave / taller -->
  <g class="cono p1"><path d="M330 362 L 290 440 H 370 Z" fill="url(#cono)"/><path d="M470 362 L 430 440 H 510 Z" fill="url(#cono)"/><path d="M590 362 L 556 440 H 624 Z" fill="url(#cono)"/></g>
  <g fill="#8b9099"><path d="M318 350 V 356 M482 350 V 356" stroke="#8b9099" stroke-width="2"/></g>
  <g class="luz p1" fill="#ffd27a"><path d="M316 356 h28 l-6 8 h-16 z"/><path d="M456 356 h28 l-6 8 h-16 z"/><path d="M576 356 h28 l-6 8 h-16 z"/></g>
  <g fill="#3a4049"><rect x="300" y="396" width="64" height="6"/><rect x="300" y="414" width="64" height="6"/><rect x="300" y="396" width="4" height="44"/><rect x="360" y="396" width="4" height="44"/></g>
  <g fill="#9a0026"><rect x="310" y="384" width="14" height="12" rx="2"/><rect x="330" y="402" width="16" height="12" rx="2"/></g>
  <rect x="420" y="398" width="70" height="42" rx="4" fill="#33373d"/><circle cx="440" cy="419" r="9" fill="#1b1f24" stroke="#5a6069" stroke-width="2"/><rect x="456" y="408" width="26" height="6" rx="2" fill="#5a6069"/>
  <rect x="540" y="378" width="60" height="62" rx="3" fill="#2c3138"/><path d="M548 392 h44 M548 406 h44 M548 420 h44" stroke="#3a4049" stroke-width="3"/>
  <text x="626" y="432" fill="rgba(255,255,255,.4)" font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="end" letter-spacing="1.5">NAVE</text>

  <!-- primera planta: vivienda -->
  <g class="cono p2"><path d="M360 256 L 316 334 H 404 Z" fill="url(#cono)"/><path d="M540 256 L 500 334 H 580 Z" fill="url(#cono)"/></g>
  <g class="luz p2" fill="#ffd27a"><circle cx="360" cy="254" r="7"/><circle cx="540" cy="254" r="7"/><circle cx="452" cy="300" r="40" fill="url(#halo)"/></g>
  <path d="M300 334 v-26 q0-8 8-8 h60 q8 0 8 8 v26" fill="#9a0026"/><rect x="296" y="312" width="84" height="22" rx="6" fill="#74001d"/>
  <rect x="430" y="286" width="44" height="28" rx="3" fill="#121519" stroke="#5a6069" stroke-width="2"/><rect class="luz p2" x="434" y="290" width="36" height="20" fill="#2b3c5a"/>
  <rect x="446" y="314" width="12" height="20" fill="#3a4049"/>
  <path d="M586 334 v-34 m-12 0 h24 l-6 -14 h-12 z" fill="none" stroke="#8b9099" stroke-width="2"/>
  <path class="luz p2" d="M574 300 h24 l-6 -14 h-12 z" fill="#ffd27a"/>
  <text x="626" y="326" fill="rgba(255,255,255,.4)" font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="end" letter-spacing="1.5">VIVIENDA</text>

  <!-- segunda planta: oficina -->
  <g class="cono p3"><path d="M340 150 L 300 230 H 380 Z" fill="url(#cono)"/><path d="M450 150 L 410 230 H 490 Z" fill="url(#cono)"/><path d="M560 150 L 520 230 H 600 Z" fill="url(#cono)"/></g>
  <g class="luz p3" fill="#ffd27a"><rect x="322" y="146" width="36" height="5" rx="2"/><rect x="432" y="146" width="36" height="5" rx="2"/><rect x="542" y="146" width="36" height="5" rx="2"/></g>
  <g fill="#33373d"><rect x="300" y="198" width="90" height="6" rx="2"/><rect x="306" y="204" width="4" height="26"/><rect x="380" y="204" width="4" height="26"/>
    <rect x="430" y="198" width="90" height="6" rx="2"/><rect x="436" y="204" width="4" height="26"/><rect x="510" y="204" width="4" height="26"/></g>
  <rect x="320" y="176" width="30" height="20" rx="2" fill="#121519" stroke="#5a6069" stroke-width="2"/><rect class="luz p3" x="323" y="179" width="24" height="14" fill="#3ddc84" opacity=".7"/>
  <rect x="452" y="176" width="30" height="20" rx="2" fill="#121519" stroke="#5a6069" stroke-width="2"/><rect class="luz p3" x="455" y="179" width="24" height="14" fill="#ff9fb6"/>
  <rect x="560" y="170" width="26" height="60" rx="3" fill="#2c3138"/><circle cx="573" cy="160" r="12" fill="#1d2a22"/>
  <text x="626" y="222" fill="rgba(255,255,255,.4)" font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="end" letter-spacing="1.5">OFICINA</text>

  <!-- farola y seto -->
  <rect x="712" y="300" width="6" height="140" fill="#2c3138"/><path d="M715 302 q0 -18 -22 -18" fill="none" stroke="#2c3138" stroke-width="6"/>
  <rect x="680" y="280" width="24" height="7" rx="3" fill="#33373d"/><path class="cono p1" d="M682 287 L 640 440 H 760 L 702 287 Z" fill="url(#cono)"/><rect class="luz p1" x="682" y="285" width="20" height="3" rx="1.5" fill="#ffd27a"/>
  <path d="M640 440 q20 -24 42 0 q22 -20 44 0 q26 -26 74 0 Z" fill="#1d2a22"/>
</svg>
